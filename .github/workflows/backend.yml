name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    name: Ruff and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: blackshield
          POSTGRES_PASSWORD: blackshield
          POSTGRES_DB: blackshield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blackshield -d blackshield_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: Dependency audit (known vulnerabilities)
        run: pip-audit --local --skip-editable --strict

      - name: Pytest (SQLite)
        run: pytest

      - name: Pytest (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://blackshield:blackshield@localhost:5432/blackshield_test
        run: pytest

  compose-smoke:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Configure a throwaway API key
        run: |
          key="bs_ci-$(openssl rand -hex 16)"
          echo "API_KEY=$key" >> "$GITHUB_ENV"
          echo "API_KEYS=ci:$(printf '%s' "$key" | sha256sum | cut -d' ' -f1)" > .env

      - name: Start api + postgres
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: GET /health returns 200
        run: curl --fail --silent --show-error http://localhost:8000/health

      - name: GET /health/ready reaches the database
        run: curl --fail --silent --show-error http://localhost:8000/health/ready

      - name: /v1 rejects requests without an API key
        run: test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8000/v1/signatures/version)" = 401

      - name: /v1 serves the migrated database
        run: |
          curl --fail --silent --show-error -H "X-API-Key: $API_KEY" http://localhost:8000/v1/signatures/version

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down --volumes

  production-config:
    name: Production compose + Nginx config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Self-signed certificate and placeholder secrets
        run: |
          mkdir -p "$RUNNER_TEMP/tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=api.example.com"             -keyout "$RUNNER_TEMP/tls/privkey.pem" -out "$RUNNER_TEMP/tls/fullchain.pem"
          sed -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-$(openssl rand -hex 16)|"               -e "s|^TLS_CERT_DIR=.*|TLS_CERT_DIR=$RUNNER_TEMP/tls|" .env.prod.example > .env

      - name: docker compose config
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: nginx -t
        run: |
          docker run --rm --add-host api:127.0.0.1             -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"             -v "$PWD/deploy/nginx/conf.d:/etc/nginx/conf.d:ro"             -v "$RUNNER_TEMP/tls:/etc/nginx/tls:ro"             nginx:1.28-alpine nginx -t

      - name: Full stack through Nginx
        run: |
          docker compose -f docker-compose.prod.yml up --build --detach --wait --wait-timeout 180
          curl --fail --silent --show-error --insecure --resolve api.example.com:443:127.0.0.1 https://api.example.com/health
          # /metrics and the docs are not served publicly.
          test "$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' --resolve api.example.com:443:127.0.0.1 https://api.example.com/metrics)" = 404

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml down --volumes
