name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v6

      # AGP installs the pinned NDK, CMake and SDK platform on first use (licenses are pre-accepted on the runner).
      - name: Assemble debug
        run: ./gradlew assembleDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Android lint, detekt, ktlint
        run: ./gradlew lint detekt ktlintCheck

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  device-tests:
    name: Native + instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Build before booting the emulator so compilation does not compete with it for CPU.
      - name: Build test APKs
        working-directory: android
        run: ./gradlew :core:scanner:assembleDebugAndroidTest :core:data:assembleDebugAndroidTest

      - name: GoogleTest + instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          working-directory: android
          script: ./gradlew :core:scanner:connectedNativeTest :core:scanner:connectedDebugAndroidTest :core:data:connectedDebugAndroidTest

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-device-test-reports
          path: |
            android/core/*/build/reports/androidTests/
            android/core/*/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
