name: Release

# Builds the signed release when a version tag is pushed (git tag v1.0.0 && git push origin v1.0.0).
# Secrets (Settings > Secrets and variables > Actions), see docs/release.md:
#   BLACKSHIELD_UPLOAD_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   BLACKSHIELD_KEYSTORE_PASSWORD, BLACKSHIELD_KEY_ALIAS, BLACKSHIELD_KEY_PASSWORD
#   BLACKSHIELD_API_BASE_URL, BLACKSHIELD_API_KEY, BLACKSHIELD_CERTIFICATE_PINS
#   BLACKSHIELD_RELEASE_CERT_SHA256      Play app signing + upload certificate digests
#   BLACKSHIELD_YARA_RULES_PUBLIC_KEYS
#   PLAY_SERVICE_ACCOUNT_JSON            optional: uploads the bundle to the internal testing track

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # the draft GitHub release

jobs:
  release:
    name: Signed release build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release  # require a reviewer before secrets are exposed
    defaults:
      run:
        working-directory: android
    env:
      BLACKSHIELD_REQUIRE_RELEASE_SIGNING: "true"
      BLACKSHIELD_KEYSTORE_PASSWORD: ${{ secrets.BLACKSHIELD_KEYSTORE_PASSWORD }}
      BLACKSHIELD_KEY_ALIAS: ${{ secrets.BLACKSHIELD_KEY_ALIAS }}
      BLACKSHIELD_KEY_PASSWORD: ${{ secrets.BLACKSHIELD_KEY_PASSWORD }}
      BLACKSHIELD_API_BASE_URL: ${{ secrets.BLACKSHIELD_API_BASE_URL }}
      BLACKSHIELD_API_KEY: ${{ secrets.BLACKSHIELD_API_KEY }}
      BLACKSHIELD_CERTIFICATE_PINS: ${{ secrets.BLACKSHIELD_CERTIFICATE_PINS }}
      BLACKSHIELD_RELEASE_CERT_SHA256: ${{ secrets.BLACKSHIELD_RELEASE_CERT_SHA256 }}
      BLACKSHIELD_YARA_RULES_PUBLIC_KEYS: ${{ secrets.BLACKSHIELD_YARA_RULES_PUBLIC_KEYS }}
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true  # release builds never write the shared cache

      - name: Tag matches the app version
        run: |
          version=$(sed -n 's/^blackshield.versionName=//p' gradle.properties)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != versionName $version"; exit 1; }
          grep -q "^## \[$version\]" ../CHANGELOG.md || { echo "CHANGELOG.md has no [$version] section"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Production settings are present
        run: |
          for name in BLACKSHIELD_API_BASE_URL BLACKSHIELD_API_KEY BLACKSHIELD_CERTIFICATE_PINS BLACKSHIELD_RELEASE_CERT_SHA256; do
            test -n "${!name}" || { echo "secret $name is not set"; exit 1; }
          done
          case "$BLACKSHIELD_API_BASE_URL" in https://*) ;; *) echo "API base URL must be https"; exit 1;; esac

      - name: Decode the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BLACKSHIELD_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          keystore="$RUNNER_TEMP/upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "BLACKSHIELD_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Checks
        run: ./gradlew testDebugUnitTest lint detekt ktlintCheck

      - name: Build the signed bundle and APK
        run: ./gradlew :app:bundleRelease :app:assembleRelease

      - name: Verify signature and release flags
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=app/build/outputs/apk/release/app-release.apk
          "$tools/apksigner" verify --print-certs "$apk"
          "$tools/aapt2" dump xmltree --file AndroidManifest.xml "$apk" > manifest.txt
          ! grep -q "debuggable" manifest.txt
          "$tools/aapt2" dump badging "$apk" | grep -q "versionName='$VERSION'"

      - name: Collect artifacts
        run: |
          out="$RUNNER_TEMP/release"; mkdir -p "$out"
          cp app/build/outputs/bundle/release/app-release.aab "$out/blackshield-$VERSION.aab"
          cp app/build/outputs/apk/release/app-release.apk "$out/blackshield-$VERSION.apk"
          cp app/build/outputs/mapping/release/mapping.txt "$out/blackshield-$VERSION-mapping.txt"
          (cd "$out" && sha256sum blackshield-* > SHA256SUMS)
          awk "/^## \[$VERSION\]/{flag=1;next}/^## \[/{flag=0}flag" ../CHANGELOG.md > "$out/notes.md"
          echo "OUT=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: blackshield-${{ env.VERSION }}
          path: ${{ env.OUT }}
          retention-days: 90

      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "BlackShield $VERSION" --notes-file "$OUT/notes.md" \
            "$OUT/blackshield-$VERSION.apk" "$OUT/SHA256SUMS"

      - name: Upload to the Play internal testing track
        if: env.HAS_PLAY_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.blackshield.app
          releaseFiles: ${{ env.OUT }}/blackshield-${{ env.VERSION }}.aab
          mappingFile: ${{ env.OUT }}/blackshield-${{ env.VERSION }}-mapping.txt
          track: internal
          status: completed

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
