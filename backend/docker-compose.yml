name: blackshield

services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the database host is the "db" service.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-blackshield}:${POSTGRES_PASSWORD:-blackshield}@db:5432/${POSTGRES_DB:-blackshield}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Periodic MalwareBazaar ingestion. Opt in: docker compose --profile worker up
  # Needs MALWAREBAZAAR_API_KEY in .env. Run exactly one.
  worker:
    build: .
    profiles: [worker]
    command: ["blackshield-signatures", "schedule"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-blackshield}:${POSTGRES_PASSWORD:-blackshield}@db:5432/${POSTGRES_DB:-blackshield}
    depends_on:
      api:
        condition: service_healthy  # the api container applies migrations on start
    healthcheck:
      disable: true  # the image's healthcheck probes the API port, which the worker does not open
    restart: unless-stopped

  # Periodic Web Shield domain ingestion (URLhaus; add --phishtank with PHISHTANK_APP_KEY).
  # Opt in: docker compose --profile domains up. Run exactly one.
  domains-worker:
    build: .
    profiles: [domains]
    command: ["blackshield-signatures", "domains-schedule"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-blackshield}:${POSTGRES_PASSWORD:-blackshield}@db:5432/${POSTGRES_DB:-blackshield}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blackshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blackshield}
      POSTGRES_DB: ${POSTGRES_DB:-blackshield}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
