# Replace api.example.com with the API's host name (it must match the certificate and the app's
# BLACKSHIELD_API_BASE_URL / certificate pins).

# Plain HTTP: ACME challenges (certificate renewal) and a redirect; nothing else.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    # Container health check (not reachable through TLS, no logging).
    location = /nginx-health {
        access_log off;
        allow 127.0.0.1;
        deny all;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name api.example.com;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    limit_req zone=per_ip burst=60 nodelay;
    limit_conn conn_per_ip 50;

    # Common proxy settings. X-Forwarded-For is *replaced* with the peer address, never appended to, so a client
    # cannot inject a fake address into the API's per-IP rate limits.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;  # the full signature snapshot streams for a while on slow networks
    proxy_buffering on;

    location /v1/ {
        limit_except GET POST { deny all; }
        proxy_pass http://api;
    }

    location = /health {
        proxy_pass http://api;
    }

    location = /health/ready {
        proxy_pass http://api;
    }

    # Metrics, docs and anything else are not served publicly. Prometheus scrapes api:8000/metrics on the
    # internal network instead.
    location / {
        return 404;
    }
}
