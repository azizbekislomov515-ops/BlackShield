# Nginx in front of the BlackShield API (docker-compose.prod.yml). TLS termination, per-IP edge limits, request
# size limits and security headers. Access logs carry no client IP or query string (privacy policy).

worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    keepalive_requests 1000;

    # Slow clients cannot hold connections open.
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    # The largest legitimate body is a 100-hash reputation lookup (~7 KiB); the API enforces 16 KiB as well.
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    large_client_header_buffers 4 8k;

    # JSON access log without $remote_addr, $request_uri arguments or headers.
    log_format privacy escape=json
        '{"ts":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time,"upstream":"$upstream_response_time",'
        '"request_id":"$request_id"}';
    access_log /dev/stdout privacy;

    # Edge limits per client IP, before the API's per-key limits. Phones behind carrier NAT share an IP, so the rate
    # is generous; the burst absorbs a sync's handful of requests. 429 instead of 503 so clients back off.
    limit_req_zone $binary_remote_addr zone=per_ip:20m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:20m;
    limit_req_status 429;
    limit_conn_status 429;

    # TLS: modern protocols only (Android 7+ supports TLS 1.2; minSdk is 26).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.11 valid=30s;

    upstream api {
        server api:8000;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
