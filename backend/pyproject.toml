[project]
name = "blackshield-backend"
version = "0.1.0"
description = "BlackShield API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.5",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.9",
    "pydantic-settings==2.16.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx2==2.16.0",  # used by starlette.testclient
    "ruff==0.17.5",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# The local alembic/ migrations folder would otherwise make the library look first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
